      - pattern: fs.readFileSync($PATH, ...)
      - pattern: fs.createReadStream($PATH, ...)
    message: "Path access without sanitization"
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      issue_code: CWE-22
      confidence: "0.55"
