rules:
  - id: mcp-tool-ssrf-py
    patterns:
      - pattern-either:
          - pattern: requests.$M($URL, ...)
          - pattern: urllib.request.urlopen($URL, ...)
          - pattern: httpx.$M($URL, ...)
      - metavariable-regex:
          metavariable: $URL
          regex: '^(?![''"](https?)://[a-zA-Z0-9._-]+)'
    message: "Possible SSRF — non-constant URL fetched without allowlist"
    languages: [python]
    severity: WARNING
    metadata:
      issue_code: CWE-918
      confidence: "0.5"
  - id: mcp-tool-ssrf-js
    patterns:
      - pattern-either:
          - pattern: fetch($URL, ...)
          - pattern: axios.$M($URL, ...)
      - metavariable-regex:
          metavariable: $URL
          regex: '^(?![`''"](https?)://[a-zA-Z0-9._-]+)'
    message: "Possible SSRF — non-constant URL fetched without allowlist"
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      issue_code: CWE-918
      confidence: "0.5"
