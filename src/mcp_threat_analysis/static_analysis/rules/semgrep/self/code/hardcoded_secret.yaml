rules:
  - id: mcp-hardcoded-secret-fallback
    languages: [generic]
    paths:
      include:
        - "*.py"
        - "*.ts"
        - "*.js"
        - "*.go"
        - "*.json"
    pattern-regex: |
      (sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{36}|AKIA[A-Z0-9]{16}|xox[pbar]-[A-Za-z0-9-]+)
    message: "Hardcoded secret pattern (fallback for non-Trufflehog environments)"
    severity: ERROR
    metadata:
      issue_code: CWE-798
      confidence: 0.9
